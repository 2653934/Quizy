<rect width="900" height="500" fill="#fffdf9"/><g font-family="Arial,sans-serif" fill="#24213e"><text x="45" y="55" font-size="30" font-weight="700">From text to a word–context score</text><text x="45" y="94" font-size="18">“the cat sat on the mat” · one neighbour on either side</text></g>
<g stroke="#6551a1" stroke-width="3" fill="#eee9fc"><rect x="40" y="190" width="170" height="110" rx="14"/><rect x="255" y="190" width="170" height="110" rx="14"/><rect x="470" y="190" width="170" height="110" rx="14"/><rect x="685" y="190" width="170" height="110" rx="14"/></g>
<g font-family="Arial,sans-serif" fill="#352b67" text-anchor="middle"><text x="125" y="257" font-size="42">1</text><text x="340" y="257" font-size="42">2</text><text x="555" y="257" font-size="42">3</text><text x="770" y="257" font-size="42">4</text></g>
