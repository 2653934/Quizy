<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#44338f"/></marker></defs>
  <rect width="1200" height="675" fill="#fbfaf7"/>
  <text x="65" y="72" font-family="Arial" font-size="42" font-weight="700" fill="#201d2c">Induction head: match and copy</text>
  <text x="65" y="115" font-family="Arial" font-size="23" fill="#5f5a6b">If A was followed by B earlier, then after A appears again, predict B</text>
  <g font-family="Arial" font-size="34" text-anchor="middle">
    <rect x="105" y="255" width="125" height="95" rx="18" fill="#e6e2f6" stroke="#44338f" stroke-width="3"/><text x="167" y="315" fill="#201d2c">Harry</text>
    <rect x="265" y="255" width="125" height="95" rx="18" fill="#ffdca8" stroke="#a65c11" stroke-width="3"/><text x="327" y="315" fill="#201d2c">Potter</text>
    <text x="475" y="315" fill="#5f5a6b">… later …</text>
    <rect x="630" y="255" width="125" height="95" rx="18" fill="#e6e2f6" stroke="#44338f" stroke-width="3"/><text x="692" y="315" fill="#201d2c">Harry</text>
    <rect x="915" y="255" width="155" height="95" rx="18" fill="#d8f1e8" stroke="#20856f" stroke-width="3"/><text x="992" y="315" fill="#201d2c">Potter</text>
  </g>
  <path d="M690 245 C650 125 205 125 170 245" fill="none" stroke="#5b4bb7" stroke-width="6" marker-end="url(#a)"/>
  <text x="430" y="155" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#5b4bb7">find the earlier matching A</text>
  <path d="M755 302 C825 302 845 302 900 302" fill="none" stroke="#20856f" stroke-width="6" marker-end="url(#a)"/>
  <text x="832" y="270" text-anchor="middle" font-family="Arial" font-size="23" font-weight="700" fill="#20856f">copy its successor</text>
  <rect x="150" y="470" width="900" height="100" rx="20" fill="#f0eef8" stroke="#a39acb" stroke-width="2"/>
  <text x="600" y="515" text-anchor="middle" font-family="Arial" font-size="25" fill="#201d2c">Layer 1 marks each token with its predecessor</text>
  <text x="600" y="550" text-anchor="middle" font-family="Arial" font-size="25" fill="#201d2c">Layer 2 matches A and copies what followed it</text>
</svg>
